<!doctype html>
<html lang="en">
  <head>

      main { max-width: 520px; text-align: center; }

      h1 { margin: 40px 0 8px; font-size: clamp(2rem, 8vw, 3.5rem); letter-spacing: -.04em; }
      p { color: #667085; line-height: 1.65; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
      a { display: inline-flex; min-height: 44px; align-items: center; border-radius: 999px; padding: 0 20px; color: #b42318; font-weight: 650; text-decoration: none; }
      nav a:first-child { background: #d92d20; color: #fff; }
      a:focus-visible { outline: 3px solid #f97066; outline-offset: 3px; }
      @media (prefers-color-scheme: dark) { :root { color-scheme: dark; color: #f2f4f7; background: #0d1018; } }

  </head>

    <main>
